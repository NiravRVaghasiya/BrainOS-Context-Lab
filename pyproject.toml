[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainos-context-lab"
version = "0.1.0"
description = "An experimental platform for evaluating BrainOS as an external cognitive-memory layer for LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "BrainOS Context Lab contributors" }
]
dependencies = []

[project.optional-dependencies]
# Gradio 5 is the floor for the messages-format Chatbot used by the Phase 4
# UI; src/app/ui.py also tolerates Gradio 6, which removed the type parameter.
ui = [
  "gradio>=6.0"
]
providers = [
  "openai>=1.0"
]
evaluation = [
  "matplotlib>=3.7",
  "pandas>=2.0"
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6"
]
# Pinned after the Phase 0 upstream validation. The distribution is named
# ``brainos-cli`` even though the runtime import package is brainos_runtime.
integration = [
  "brainos-cli @ git+https://github.com/NiravRVaghasiya/BrainOS.git@1d9eb7a0ca537e7278e29809cda4f4c5da6c1dcc"
]

[project.scripts]
brainos-context-lab = "app.ui:main"
brainos-context-evaluate = "evaluation.run:main"
brainos-context-pipeline = "evaluation.pipeline:main"

# Vercel detects FastAPI from requirements.txt, then finds the application by
# scanning its default entrypoint locations (app.py, index.py, server.py,
# main.py, wsgi.py, asgi.py at the root or under src/, app/, api/) for a
# *module-level* `app` assignment. This repository has two of those files and
# only one is an ASGI app: the root app.py is the Hugging Face Space launcher,
# which deliberately imports nothing at module scope (see its comment — a
# module-scope UI import closes an import cycle through src/evaluation). The
# scan cannot tell them apart, so the entrypoint is named instead of guessed:
#
#   Error: Found app.py, api/index.py but none define a top-level "app" FastAPI
#   instance.
#
# api/index.py keeps `app = _build_app()` at column zero for the scan and still
# answers /api/* on every path, including the degraded one.
[tool.vercel]
entrypoint = "api.index:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
# Phase 18: tests that need the optional integration extra are marked, and
# `tests/conftest.py` turns the marker into a skip when the runtime is absent.
markers = [
  "requires_runtime: needs the pinned BrainOS runtime (pip install -e '.[integration]')",
  "requires_figures: needs matplotlib (pip install -e '.[evaluation]')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# Phase 18. Coverage is an audit instrument here, not a target to game: it is
# what found the provider adapter's untested branches and the absence of any
# log-surface test. The floor sits below the measured number so a real
# regression trips it while ordinary edits do not.
[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "if __name__ == .__main__.:",
]
